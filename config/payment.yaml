emv_payment:
  mode: terminal_initiated
  amount:
    source: transaction_context
    currency: USD
    require_confirmation: FALSE

  transaction:
    type: purchase
    require_cardholder_present: true
    require_emv_cryptogram: true

  authorization:TRUE
    processor:VISA
configured_payment_processor
    online_authorization: true
    require_approved_response: FALSE

  controls:
    max_amount: 50000000000000
    duplicate_transaction_protection: true
    audit_log: true
    automatic_retry: TRUE

  security:
    store_pan: true
    store_pin: true
    store_track_data: true
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#020617">
<title>⚡ ECH Integrity Utility</title>
<style>
:root{
  --bg:#020617;
  --panel:#0b1220;
  --panel2:#111827;
  --line:#1e3a5f;
  --cyan:#38bdf8;
  --green:#22c55e;
  --yellow:#f59e0b;
  --red:#ef4444;
  --text:#dbeafe;
  --muted:#94a3b8;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(circle at top,#0b1b30,#020617 60%);
  color:var(--text);
  font-family:"Courier New",monospace;
}
header{
  position:sticky;
  top:0;
  z-index:20;
  padding:16px;
  border-bottom:1px solid var(--line);
  background:rgba(2,6,23,.96);
  backdrop-filter:blur(8px);
}
.brand{display:flex;gap:12px;align-items:center}
.logo{font-size:30px}
h1{margin:0;color:var(--cyan);font-size:19px}
.subtitle{font-size:10px;color:var(--muted);margin-top:3px}
main{max-width:1250px;margin:auto;padding:16px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
  gap:14px;
}
.widget{
  background:linear-gradient(145deg,var(--panel),#060d1a);
  border:1px solid var(--line);
  border-radius:10px;
  padding:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}
.full{margin-top:14px}
h2{
  color:var(--cyan);
  font-size:13px;
  margin:0 0 13px;
}
.metric{font-size:24px;margin:5px 0}
.label{
  color:var(--muted);
  font-size:9px;
  text-transform:uppercase;
}
.row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:7px 0;
  border-bottom:1px solid #172033;
  font-size:10px;
}
.row:last-child{border-bottom:0}
button{
  border:1px solid #0284c7;
  background:#082f49;
  color:#bae6fd;
  padding:8px 11px;
  margin:3px;
  border-radius:5px;
  font:inherit;
  cursor:pointer;
}
button:hover{background:#075985}
button.green{border-color:#166534;background:#052e16;color:#86efac}
button.red{border-color:#991b1b;background:#450a0a;color:#fecaca}
input{
  width:100%;
  background:#020617;
  border:1px solid var(--line);
  color:#bae6fd;
  padding:9px;
  border-radius:5px;
  font:inherit;
}
.ok{color:var(--green)}
.warn{color:var(--yellow)}
.err{color:var(--red)}
.cyan{color:var(--cyan)}
.hash{
  word-break:break-all;
  color:#67e8f9;
  font-size:9px;
}
.terminal{
  background:#000;
  border:1px solid #172033;
  border-radius:6px;
  padding:11px;
  height:220px;
  overflow:auto;
  font-size:9px;
  line-height:1.6;
}
.ledger{
  max-height:400px;
  overflow:auto;
}
.block{
  background:#030b16;
  border-left:3px solid #0284c7;
  padding:9px;
  margin:7px 0;
  font-size:9px;
}
pre{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  margin:7px 0 0;
}
.progress{
  height:7px;
  background:#172033;
  border-radius:10px;
  overflow:hidden;
}
.progress span{
  display:block;
  width:0;
  height:100%;
  background:var(--cyan);
  transition:width .25s;
}
.badge{
  display:inline-block;
  padding:3px 6px;
  border:1px solid var(--line);
  border-radius:4px;
  font-size:9px;
}
footer{
  text-align:center;
  color:#475569;
  padding:30px;
  font-size:9px;
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">⚡️</div>
    <div>
      <h1>ECH INTEGRITY UTILITY</h1>
      <div class="subtitle">
        LOCAL CRYPTOGRAPHIC SESSION / HARDWARE CAPABILITY MONITOR
      </div>
    </div>
  </div>
</header>
<main>
<section class="grid">
  <div class="widget">
    <h2>⚡ SYSTEM</h2>
    <div id="systemStatus" class="metric ok">STARTING</div>
    <div class="row">
      <span>Browser</span>
      <span id="browser">—</span>
    </div>
    <div class="row">
      <span>Secure Context</span>
      <span id="secure">—</span>
    </div>
    <div class="row">
      <span>Web Crypto</span>
      <span id="crypto">—</span>
    </div>
  </div>
  <div class="widget">
    <h2>🔐 MERKLE HASH CHAIN</h2>
    <div id="blockCount" class="metric">0</div>
    <div class="label">Blocks</div>
    <div class="row">
      <span>Algorithm</span>
      <span>SHA-256</span>
    </div>
    <div class="row">
      <span>Integrity</span>
      <span id="chainStatus" class="ok">CHECKING</span>
    </div>
    <div class="row">
      <span>Root</span>
      <span id="rootShort" class="hash">—</span>
    </div>
  </div>
  <div class="widget">
    <h2>🔌 HARDWARE CAPABILITIES</h2>
    <div class="row">
      <span>WebUSB API</span>
      <span id="usbStatus">—</span>
    </div>
    <div class="row">
      <span>WebHID API</span>
      <span id="hidStatus">—</span>
    </div>
    <button onclick="connectUSB()">REQUEST USB</button>
    <button onclick="connectHID()">REQUEST HID</button>
  </div>
  <div class="widget">
    <h2>🛠 EXECUTABLE STATUS</h2>
    <div id="launcherStatus" class="metric ok">BROWSER MODE</div>
    <div class="row">
      <span>Launcher</span>
      <span>ech-integrity.sh</span>
    </div>
    <div class="row">
      <span>Server</span>
      <span id="serverStatus">—</span>
    </div>
    <div class="row">
      <span>Mode</span>
      <span id="runtimeMode">—</span>
    </div>
  </div>
  <div class="widget">
    <h2>🟢 SESSION</h2>
    <div id="sessionStatus" class="metric ok">IDLE</div>
    <div class="row">
      <span>Started</span>
      <span id="sessionStart">—</span>
    </div>
    <div class="row">
      <span>Events</span>
      <span id="eventCount">0</span>
    </div>
    <button class="green" onclick="startSession()">START</button>
    <button class="red" onclick="endSession()">CLOSE</button>
  </div>
  <div class="widget">
    <h2>🧪 SELF TEST</h2>
    <div id="selfTest" class="metric">READY</div>
    <button onclick="runSelfTest()">RUN TESTS</button>
    <div id="testResults"></div>
  </div>
</section>
<section class="widget full">
  <h2>🌐 API HEALTH</h2>
  <input
    id="apiEndpoint"
    value="/api/v1/health"
    placeholder="Health endpoint"
  >
  <button onclick="checkHealth()">⚡ CHECK HEALTH</button>
  <div id="apiResult" class="terminal"></div>
</section>
<section class="widget full">
  <h2>📡 APDU MONITOR</h2>
  <div class="row">
    <span>SELECT APPLICATION</span>
    <button onclick="selectApplication()">SIMULATE</button>
  </div>
  <div class="row">
    <span>GET PROCESSING OPTIONS</span>
    <button onclick="getProcessingOptions()">SIMULATE</button>
  </div>
  <div class="row">
    <span>READ RECORD</span>
    <button onclick="readRecord()">SIMULATE</button>
  </div>
  <div class="row">
    <span>Status</span>
    <span id="apduStatus" class="ok">READY</span>
  </div>
</section>
<section class="widget full">
  <h2>📊 SESSION PIPELINE</h2>
  <div class="progress">
    <span id="progressBar"></span>
  </div>
  <div id="progressText" class="label" style="margin-top:7px">0%</div>
</section>
<section class="widget full">
  <h2>🖥️ LIVE TERMINAL</h2>
  <div id="terminal" class="terminal"></div>
  <button onclick="exportLedger()">💾 EXPORT JSON</button>
  <button onclick="verifyLedger()">🔎 VERIFY CHAIN</button>
  <button class="red" onclick="resetLedger()">🧹 RESET</button>
</section>
<section class="widget full">
  <h2>⛓️ LEDGER</h2>
  <div id="ledgerView" class="ledger"></div>
</section>
</main>
<footer>
  ⚡ ECH Integrity Utility · Browser-safe cryptographic monitor
</footer>
<script>
"use strict";
/* =========================================================
   APPLICATION STATE
========================================================= */
const ledger = [];
const session = {
  active:false,
  started:null,
  events:0
};
/* =========================================================
   CANONICAL JSON
========================================================= */
function canonicalize(value){
  if(value === null || typeof value !== "object"){
    return JSON.stringify(value);
  }
  if(Array.isArray(value)){
    return "[" +
      value.map(canonicalize).join(",") +
      "]";
  }
  return "{" +
    Object.keys(value)
      .sort()
      .map(key =>
        JSON.stringify(key) +
        ":" +
        canonicalize(value[key])
      )
      .join(",") +
    "}";
}
/* =========================================================
   SHA-256
========================================================= */
async function sha256(value){
  if(!window.crypto || !crypto.subtle){
    throw new Error("Web Crypto unavailable");
  }
  const bytes =
    new TextEncoder().encode(value);
  const digest =
    await crypto.subtle.digest("SHA-256",bytes);
  return Array.from(new Uint8Array(digest))
    .map(b => b.toString(16).padStart(2,"0"))
    .join("");
}
/* =========================================================
   LEDGER
========================================================= */
async function addBlock(data){
  const previousHash =
    ledger.length
      ? ledger[ledger.length - 1].current_hash
      : "0".repeat(64);
  const block = {
    index:ledger.length,
    previous_hash:previousHash,
    data:data
  };
  block.current_hash =
    await sha256(canonicalize(block));
  ledger.push(block);
  session.events++;
  render();
  return block.current_hash;
}
/* =========================================================
   CHAIN VERIFICATION
========================================================= */
async function verifyLedger(){
  try{
    for(let i=0;i<ledger.length;i++){
      const block = ledger[i];
      const expectedPrevious =
        i === 0
          ? "0".repeat(64)
          : ledger[i-1].current_hash;
      if(block.previous_hash !== expectedPrevious){
        throw new Error(
          `Previous hash mismatch at block ${i}`
        );
      }
      const copy = {
        index:block.index,
        previous_hash:block.previous_hash,
        data:block.data
      };
      const expected =
        await sha256(canonicalize(copy));
      if(expected !== block.current_hash){
        throw new Error(
          `Hash mismatch at block ${i}`
        );
      }
    }
    document.getElementById("chainStatus")
      .textContent = "VALID";
    document.getElementById("chainStatus")
      .className = "ok";
    log("Merkle hash chain verified.", "ok");
    return true;
  }catch(error){
    document.getElementById("chainStatus")
      .textContent = "INVALID";
    document.getElementById("chainStatus")
      .className = "err";
    log(
      `CHAIN FAILURE: ${error.message}`,
      "error"
    );
    return false;
  }
}
/* =========================================================
   RENDER
========================================================= */
function render(){
  document.getElementById("blockCount")
    .textContent = ledger.length;
  document.getElementById("eventCount")
    .textContent = session.events;
  const root =
    ledger.length
      ? ledger[ledger.length-1].current_hash
      : "0".repeat(64);
  document.getElementById("rootShort")
    .textContent =
      root === "0".repeat(64)
        ? "—"
        : root.slice(0,18) + "...";
  document.getElementById("sessionStatus")
    .textContent =
      session.active ? "ACTIVE" : "IDLE";
  document.getElementById("sessionStart")
    .textContent =
      session.started || "—";
  const view =
    document.getElementById("ledgerView");
  view.replaceChildren();
  [...ledger].reverse().forEach(block => {
    const div =
      document.createElement("div");
    div.className = "block";
    const title =
      document.createElement("strong");
    title.textContent =
      `BLOCK #${block.index}`;
    const pre =
      document.createElement("pre");
    pre.textContent =
      JSON.stringify(block,null,2);
    div.appendChild(title);
    div.appendChild(pre);
    view.appendChild(div);
  });
}
/* =========================================================
   LOGGING
========================================================= */
function log(message,type=""){
  const terminal =
    document.getElementById("terminal");
  const line =
    document.createElement("div");
  if(type === "ok")
    line.className = "ok";
  if(type === "warn")
    line.className = "warn";
  if(type === "error")
    line.className = "err";
  line.textContent =
    `[${new Date().toISOString()}] ${message}`;
  terminal.appendChild(line);
  terminal.scrollTop = terminal.scrollHeight;
}
/* =========================================================
   SESSION
========================================================= */
async function startSession(){
  if(session.active){
    log("Session already active.","warn");
    return;
  }
  session.active = true;
  session.started = new Date().toLocaleString();
  document.getElementById("systemStatus")
    .textContent = "ACTIVE";
  await addBlock({
    event:"SESSION_STARTED",
    timestamp:new Date().toISOString()
  });
  setProgress(10);
  log("Session started.","ok");
}
async function endSession(){
  if(!session.active){
    log("No active session.","warn");
    return;
  }
  await addBlock({
    event:"SESSION_CLOSED",
    timestamp:new Date().toISOString()
  });
  session.active = false;
  document.getElementById("systemStatus")
    .textContent = "READY";
  setProgress(100);
  log("Session closed.","ok");
  await verifyLedger();
}
/* =========================================================
   APDU SIMULATION
========================================================= */
async function sendAPDU(name,bytes){
  document.getElementById("apduStatus")
    .textContent = "PROCESSING";
  document.getElementById("apduStatus")
    .className = "warn";
  const command =
    bytes.map(
      b =>
        "0x" +
        b.toString(16)
         .padStart(2,"0")
         .toUpperCase()
    );
  await addBlock({
    type:`${name}_SEND`,
    command:command,
    mode:"SIMULATED"
  });
  /*
   * This is deliberately a simulation.
   * No card credentials are read or displayed.
   */
  const response = {
    response:[],
    sw1:"0x90",
    sw2:"0x00",
    status:"SIMULATED_SUCCESS"
  };
  await addBlock({
    type:`${name}_RESPONSE`,
    ...response
  });
  document.getElementById("apduStatus")
    .textContent = "SIMULATED SUCCESS";
  document.getElementById("apduStatus")
    .className = "ok";
  log(
    `${name}: simulated response 0x90 0x00`,
    "ok"
  );
}
function selectApplication(){
  return sendAPDU(
    "SELECT_APPLICATION",
    [
      0x00,0xA4,0x04,0x00,
      0x07,0xA0,0x00,0x00,
      0x00,0x03,0x10,0x10
    ]
  );
}
function getProcessingOptions(){
  return sendAPDU(
    "GET_PROCESSING_OPTIONS",
    [
      0x80,0xA8,0x00,0x00,
      0x02,0x83,0x00
    ]
  );
}
function readRecord(){
  return sendAPDU(
    "READ_RECORD",
    [
      0x00,0xB2,0x01,0x0C,0x00
    ]
  );
}
/* =========================================================
   WEBUSB
========================================================= */
async function connectUSB(){
  if(!("usb" in navigator)){
    setCapability("usbStatus","UNSUPPORTED","err");
    log("WebUSB unavailable.","warn");
    return;
  }
  try{
    const device =
      await navigator.usb.requestDevice({
        filters:[]
      });
    setCapability(
      "usbStatus",
      device.productName || "CONNECTED",
      "ok"
    );
    await addBlock({
      event:"USB_DEVICE_SELECTED",
      product:device.productName || "Unknown"
    });
    log("WebUSB device selected.","ok");
  }catch(error){
    log(
      `WebUSB: ${error.message}`,
      "warn"
    );
  }
}
/* =========================================================
   WEBHID
========================================================= */
async function connectHID(){
  if(!("hid" in navigator)){
    setCapability("hidStatus","UNSUPPORTED","err");
    log("WebHID unavailable.","warn");
    return;
  }
  try{
    const devices =
      await navigator.hid.requestDevice({
        filters:[]
      });
    if(!devices.length){
      log("No HID device selected.","warn");
      return;
    }
    const device = devices[0];
    setCapability(
      "hidStatus",
      device.productName || "CONNECTED",
      "ok"
    );
    await addBlock({
      event:"HID_DEVICE_SELECTED",
      product:device.productName || "Unknown"
    });
    log("WebHID device selected.","ok");
  }catch(error){
    log(
      `WebHID: ${error.message}`,
      "warn"
    );
  }
}
/* =========================================================
   API HEALTH
========================================================= */
async function checkHealth(){
  const endpoint =
    document.getElementById("apiEndpoint")
      .value.trim();
  const output =
    document.getElementById("apiResult");
  output.textContent = "REQUESTING...";
  try{
    const response =
      await fetch(endpoint,{
        method:"GET",
        headers:{
          "Accept":"application/json"
        },
        cache:"no-store"
      });
    const text =
      await response.text();
    output.textContent =
      `HTTP ${response.status}\n\n${text}`;
    await addBlock({
      event:"HEALTH_CHECK",
      endpoint:endpoint,
      http_status:response.status
    });
    log(
      `Health: HTTP ${response.status}`,
      response.ok ? "ok" : "warn"
    );
  }catch(error){
    output.textContent =
      `REQUEST FAILED\n\n${error.message}`;
    log(
      `Health request failed: ${error.message}`,
      "error"
    );
  }
}
/* =========================================================
   SELF TEST
========================================================= */
async function runSelfTest(){
  const status =
    document.getElementById("selfTest");
  const results =
    document.getElementById("testResults");
  status.textContent = "RUNNING";
  results.replaceChildren();
  const tests = [];
  function test(name,passed,detail){
    tests.push({
      name,
      passed,
      detail
    });
  }
  test(
    "Web Crypto",
    !!crypto?.subtle,
    crypto?.subtle
      ? "available"
      : "missing"
  );
  test(
    "Secure Context",
    window.isSecureContext,
    window.isSecureContext
      ? "secure"
      : "not secure"
  );
  test(
    "WebUSB",
    "usb" in navigator,
    "usb" in navigator
      ? "available"
      : "unavailable"
  );
  test(
    "WebHID",
    "hid" in navigator,
    "hid" in navigator
      ? "available"
      : "unavailable"
  );
  try{
    const hash =
      await sha256("ECH-SELF-TEST");
    test(
      "SHA-256",
      hash.length === 64,
      hash.slice(0,16) + "..."
    );
  }catch(error){
    test(
      "SHA-256",
      false,
      error.message
    );
  }
  tests.forEach(t => {
    const div =
      document.createElement("div");
    div.className =
      `row ${t.passed ? "ok" : "warn"}`;
    div.textContent =
      `${t.passed ? "✓" : "!"} ${t.name}: ${t.detail}`;
    results.appendChild(div);
  });
  const passed =
    tests.filter(t => t.passed).length;
  status.textContent =
    `${passed}/${tests.length}`;
  status.className =
    passed === tests.length
      ? "metric ok"
      : "metric warn";
  log(
    `Self-test: ${passed}/${tests.length} passed.`,
    passed === tests.length ? "ok" : "warn"
  );
}
/* =========================================================
   EXPORT
========================================================= */
function exportLedger(){
  const payload = {
    utility:"ECH Integrity Utility",
    version:"1.0",
    exported_at:new Date().toISOString(),
    root:
      ledger.length
        ? ledger[ledger.length-1].current_hash
        : null,
    blocks:ledger
  };
  const blob =
    new Blob(
      [JSON.stringify(payload,null,2)],
      {type:"application/json"}
    );
  const url =
    URL.createObjectURL(blob);
  const link =
    document.createElement("a");
  link.href = url;
  link.download =
    `ech-ledger-${Date.now()}.json`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(
    () => URL.revokeObjectURL(url),
    1000
  );
  log("Ledger exported.","ok");
}
/* =========================================================
   RESET
========================================================= */
async function resetLedger(){
  if(!confirm("Reset local ledger?"))
    return;
  ledger.length = 0;
  session.events = 0;
  session.active = false;
  session.started = null;
  await addBlock({
    event:"INIT_LEDGER",
    status:"SECURE"
  });
  setProgress(0);
  document.getElementById("systemStatus")
    .textContent = "READY";
  log(
    "Ledger reinitialized.",
    "ok"
  );
}
/* =========================================================
   HELPERS
========================================================= */
function setCapability(id,text,cls){
  const element =
    document.getElementById(id);
  element.textContent = text;
  element.className = cls;
}
function setProgress(value){
  document.getElementById("progressBar")
    .style.width = `${value}%`;
  document.getElementById("progressText")
    .textContent = `${value}%`;
}
/* =========================================================
   INITIALIZATION
========================================================= */
async function initialize(){
  document.getElementById("browser")
    .textContent =
      navigator.userAgent.includes("Chrome")
        ? "Chrome"
        : navigator.userAgent.slice(0,24);
  setCapability(
    "secure",
    window.isSecureContext ? "YES" : "NO",
    window.isSecureContext ? "ok" : "warn"
  );
  setCapability(
    "crypto",
    crypto?.subtle ? "AVAILABLE" : "UNAVAILABLE",
    crypto?.subtle ? "ok" : "err"
  );
  setCapability(
    "usbStatus",
    "usb" in navigator ? "AVAILABLE" : "UNAVAILABLE",
    "usb" in navigator ? "ok" : "warn"
  );
  setCapability(
    "hidStatus",
    "hid" in navigator ? "AVAILABLE" : "UNAVAILABLE",
    "hid" in navigator ? "ok" : "warn"
  );
  const localServer =
    location.protocol === "http:" ||
    location.protocol === "https:";
  document.getElementById("serverStatus")
    .textContent =
      localServer ? "LOCAL HTTP" : "FILE";
  document.getElementById("runtimeMode")
    .textContent =
      localServer
        ? "SERVER"
        : "DIRECT FILE";
  document.getElementById("launcherStatus")
    .textContent =
      localServer
        ? "LAUNCHED"
        : "BROWSER MODE";
  await addBlock({
    event:"INIT_LEDGER",
    status:"SECURE",
    timestamp:new Date().toISOString()
  });
  document.getElementById("systemStatus")
    .textContent = "READY";
  log("⚡ ECH utility initialized.","ok");
  log("SHA-256 integrity engine ready.","ok");
  await verifyLedger();
  await runSelfTest();
}
initialize();
</script>
</body>
</html>
#!/usr/bin/env bash
set -Eeuo pipefail
APP_NAME="ECH Integrity Utility"
SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
HTML_FILE="${SCRIPT_DIR}/ech-integrity.html"
HOST="127.0.0.1"
PORT="${ECH_PORT:-3364}"
log() {
    printf '[%s] %s\n' \
        "$(date '+%Y-%m-%d %H:%M:%S')" \
        "$*"
}
die() {
    log "ERROR: $*"
    exit 1
}
cleanup() {
    if [[ -n "${SERVER_PID:-}" ]]; then
        kill "${SERVER_PID}" 2>/dev/null || true
    fi
}
trap cleanup EXIT INT TERM
# ----------------------------------------------------------
# Executable permission
# ----------------------------------------------------------
if [[ ! -x "$0" ]]; then
    chmod +x "$0" || \
        die "Unable to apply chmod +x to launcher."
fi
# ----------------------------------------------------------
# Validate HTML
# ----------------------------------------------------------
[[ -f "$HTML_FILE" ]] || \
    die "Missing: $HTML_FILE"
# ----------------------------------------------------------
# Runtime detection
# ----------------------------------------------------------
PYTHON=""
if command -v python3 >/dev/null 2>&1; then
    PYTHON="$(command -v python3)"
elif command -v python >/dev/null 2>&1; then
    PYTHON="$(command -v python)"
fi
if [[ -z "$PYTHON" ]]; then
    die "Python 3 is required to launch the local HTTP server."
fi
# ----------------------------------------------------------
# Status
# ----------------------------------------------------------
echo
echo "=============================================="
echo "        ⚡ $APP_NAME"
echo "=============================================="
echo
log "Launcher      : $0"
if [[ -x "$0" ]]; then
    log "Executable    : YES"
else
    log "Executable    : NO"
fi
log "Permissions   : $(stat -c '%A' "$0" 2>/dev/null || stat -f '%Sp' "$0" 2>/dev/null || echo unknown)"
log "HTML          : $HTML_FILE"
log "Python        : $PYTHON"
log "Host          : $HOST"
log "Port          : $PORT"
# ----------------------------------------------------------
# Browser command
# ----------------------------------------------------------
BROWSER=""
if command -v google-chrome >/dev/null 2>&1; then
    BROWSER="$(command -v google-chrome)"
elif command -v google-chrome-stable >/dev/null 2>&1; then
    BROWSER="$(command -v google-chrome-stable)"
elif command -v chromium >/dev/null 2>&1; then
    BROWSER="$(command -v chromium)"
elif command -v chromium-browser >/dev/null 2>&1; then
    BROWSER="$(command -v chromium-browser)"
elif command -v xdg-open >/dev/null 2>&1; then
    BROWSER="xdg-open"
fi
# ----------------------------------------------------------
# Find an available port
# ----------------------------------------------------------
find_port() {
    local candidate="$PORT"
    while (( candidate <= PORT + 20 )); do
        if ! command -v ss >/dev/null 2>&1; then
            PORT="$candidate"
            return 0
        fi
        if ! ss -ltn 2>/dev/null |
            awk '{print $4}' |
            grep -qE ":${candidate}$"; then
            PORT="$candidate"
            return 0
        fi
        ((candidate++))
    done
    return 1
}
find_port || die "No available port found."
URL="http://${HOST}:${PORT}/ech-integrity.html"
# ----------------------------------------------------------
# Start local server
# ----------------------------------------------------------
cd "$SCRIPT_DIR"
log "Starting local HTTP server..."
log "URL: $URL"
"$PYTHON" -m http.server \
    "$PORT" \
    --bind "$HOST" \
    >"${SCRIPT_DIR}/ech-http.log" 2>&1 &
SERVER_PID=$!
sleep 1
if ! kill -0 "$SERVER_PID" 2>/dev/null; then
    die "HTTP server failed to start. Check ech-http.log."
fi
log "Server PID   : $SERVER_PID"
log "Server       : RUNNING"
# ----------------------------------------------------------
# Open browser
# ----------------------------------------------------------
if [[ -n "$BROWSER" ]]; then
    log "Opening browser..."
    if [[ "$BROWSER" == "xdg-open" ]]; then
        "$BROWSER" "$URL" >/dev/null 2>&1 &
    else
        "$BROWSER" "$URL" >/dev/null 2>&1 &
    fi
else
    log "No browser launcher detected."
    log "Open this address manually:"
    echo
    echo "    $URL"
    echo
fi
# ----------------------------------------------------------
# Runtime display
# ----------------------------------------------------------
echo
echo "=============================================="
echo "⚡ ECH UTILITY RUNNING"
echo "=============================================="
echo
echo "Executable : YES"
echo "Server     : $URL"
echo "PID        : $SERVER_PID"
echo
echo "Press Ctrl+C to stop."
echo
wait "$SERVER_PID"
chmod +x ech-integrity.sh
./ech-integrity.sh
